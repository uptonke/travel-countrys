name: One-time Country Autofill Patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-country-autofill.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch country autofill behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          script_path = Path('script.js')

          index = index_path.read_text(encoding='utf-8')
          old_country_input = '<input type="text" id="input-country" placeholder="系統自動帶入，也可手填" required>'
          new_country_input = '<input type="text" id="input-country" placeholder="可自動帶入，也可手填縮小搜尋">'
          if old_country_input in index:
              index = index.replace(old_country_input, new_country_input)

          script = script_path.read_text(encoding='utf-8')

          old_fetch = """async function fetchRegionBoundary(region, country) {\n    try {\n        const data = await apiFetch(`/api/boundary?region=${encodeURIComponent(region)}&country=${encodeURIComponent(country)}`, {}, { timeoutMs: 12000 });\n        if(data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), geojson: data[0].geojson };\n    } catch(e){ \n        console.error(\"邊界抓取失敗:\", e); \n    } \n    return null;\n}\n"""
          new_fetch = """async function fetchRegionBoundary(region, country = '') {\n    try {\n        const data = await apiFetch(`/api/boundary?region=${encodeURIComponent(region)}&country=${encodeURIComponent(country || '')}`, {}, { timeoutMs: 25000 });\n        if (data && data.length > 0) {\n            const item = data[0];\n            return {\n                lat: parseFloat(item.lat),\n                lng: parseFloat(item.lon),\n                geojson: item.geojson,\n                country: item.address?.country || country || '',\n                region: item.name || region,\n                address: item.address || {},\n                displayName: item.display_name || ''\n            };\n        }\n    } catch(e){ \n        console.error(\"邊界抓取失敗:\", e); \n    } \n    return null;\n}\n"""
          if old_fetch in script:
              script = script.replace(old_fetch, new_fetch)
          elif "async function fetchRegionBoundary(region, country)" not in script:
              raise SystemExit('fetchRegionBoundary block not found or already changed')

          old_submit = """    const dateRangeStr = `${formatDateLocal(dStart)} 到 ${formatDateLocal(dEnd)}`;\n    const geoData=await fetchRegionBoundary(regionInput.value.trim(), standardizeCountry(countryInput.value));\n    if (!geoData) {\n    showToast(UI_TEXT.toast.geoNotFound, 'error', 3200);\n    syncSubmitButtonUI();\n    return;\n}\n    const normalizedCountry = formatPlaceName(standardizeCountry(countryInput.value));\nconst normalizedRegion = formatPlaceName(regionInput.value.trim());\n"""
          new_submit = """    const dateRangeStr = `${formatDateLocal(dStart)} 到 ${formatDateLocal(dEnd)}`;\n    const geoData = await fetchRegionBoundary(regionInput.value.trim(), standardizeCountry(countryInput.value));\n    if (!geoData) {\n    showToast(UI_TEXT.toast.geoNotFound, 'error', 3200);\n    syncSubmitButtonUI();\n    return;\n}\n    const inferredCountry = geoData.country || countryInput.value;\n    if (!countryInput.value.trim() && inferredCountry) countryInput.value = inferredCountry;\n    const normalizedCountry = formatPlaceName(standardizeCountry(inferredCountry));\nconst normalizedRegion = formatPlaceName(regionInput.value.trim());\n"""
          if old_submit in script:
              script = script.replace(old_submit, new_submit)
          elif "const inferredCountry = geoData.country || countryInput.value" not in script:
              raise SystemExit('submit country block not found or already changed')

          index_path.write_text(index, encoding='utf-8')
          script_path.write_text(script, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-country-autofill.yml

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html script.js .github/workflows/patch-country-autofill.yml
          git commit -m "Make country field optional and infer from geocode"
          git push
